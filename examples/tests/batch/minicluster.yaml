apiVersion: flux-framework.org/v1alpha2
kind: MiniCluster
metadata:
  name: flux-sample
spec:
  # suppress all output except for test run
  logging:
    quiet: true

  # Number of pods to create for MiniCluster
  size: 2

  # This is a list because a pod can support multiple containers
  containers:
    - image: ubuntu:noble

      # The batch content is written verbatim and run with flux batch.
      # Provide your own flux submit lines (they are not wrapped for you).
      batch: |
        #!/bin/bash
        flux submit --output=/tmp/fluxout/job-0.out echo hello world 1
        flux submit --output=/tmp/fluxout/job-1.out echo hello world 2
        flux submit --output=/tmp/fluxout/job-2.out echo hello world 3
        flux queue idle

      # List the contents before exiting
      commands:
        post: |
          ls /tmp/fluxout -1
          cat /tmp/fluxout/job-0.out

      # Flux batch will write output here
      volumes:
        data:
          path: /tmp/fluxout
